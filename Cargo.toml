[workspace]
resolver = "2"
members = ["crates/polis_core", "crates/polis_mind", "crates/polis_cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/eyadstein/polis-genesis"
homepage = "https://eyadstein.github.io/polis-genesis/"
documentation = "https://eyadstein.github.io/polis-genesis/world.html"

[profile.release]
opt-level = 3
lto = true

# Tests run whole towns for thousands of ticks, so keep them optimized.
[profile.test]
opt-level = 2
