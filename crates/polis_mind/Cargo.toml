[package]
name = "polis_mind"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Turns what people do into words, and builds the inner voice behind them"

[features]
ollama = ["dep:ureq", "dep:serde_json"]

[dependencies]
polis_core = { path = "../polis_core" }
ureq = { version = "2", default-features = false, features = ["json"], optional = true }
serde_json = { version = "1", optional = true }
